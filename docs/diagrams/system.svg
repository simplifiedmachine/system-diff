<style>
text { font-family: 'Segoe UI', FreeSans, 'Helvetica Neue', Arial, sans-serif; }
.bg { fill: #f8f9fb; stroke: #e1e5eb; }
.col { font-size: 11px; font-weight: 600; letter-spacing: .05em; fill: #667385; }
.bn .box { fill: #ffffff; stroke: #e1e5eb; stroke-width: 1.2; }
.bn.t-store .box { fill: #e8f0fc; }
.bn.legacy .box { fill: #f8f9fb; stroke: #c3cad4; stroke-dasharray: 5 4; }
.bn.legacy .bn-t { fill: #3b4655; }
.bn .band { fill: #1f5fbf; }
.bn.undeclared .band { fill: #9a5600; }
.bn.s-added .box { stroke: #157347; stroke-width: 1.8; } .bn.s-added .band { fill: #157347; }
.bn.s-changed .box { stroke: #9a5600; stroke-width: 1.8; } .bn.s-changed .band { fill: #9a5600; }
.bn.s-removed .box { stroke: #c4321c; stroke-dasharray: 5 4; fill: #fdecea; } .bn.s-removed .band { fill: #c4321c; }
.bn-t { font-size: 13px; font-weight: 600; fill: #161c24; }
.bn-s { font-size: 11.5px; fill: #667385; }
.bn-p { font-size: 11.5px; fill: #3b4655; } .bn-p.code { font-family: Consolas, Inconsolata, 'DejaVu Sans Mono', monospace; } .bn-p.more { fill: #667385; }
.bn-p.s-added { fill: #157347; font-weight: 600; } .bn-p.s-changed { fill: #9a5600; font-weight: 600; }
.bn-p.s-removed { fill: #c4321c; text-decoration: line-through; }
.be { fill: none; stroke: #667385; stroke-width: 1.4; opacity: .75; }
.be.k-data { stroke: #1f5fbf; } .be.k-network { stroke: #9a5600; stroke-dasharray: 6 4; }
.be.s-added { stroke: #157347; stroke-width: 2.2; opacity: 1; }
.be.s-removed { stroke: #c4321c; stroke-dasharray: 5 4; opacity: 1; }
.ar { fill: #667385; } .ar.k-data { fill: #1f5fbf; } .ar.k-network { fill: #9a5600; }
.ar.s-added { fill: #157347; } .ar.s-removed { fill: #c4321c; } .ar.k-person { fill: #1f5fbf; }
.halo { paint-order: stroke; stroke: #f8f9fb; stroke-width: 4px; stroke-linejoin: round; }
.lg { font-size: 11.5px; fill: #667385; }
.lg.s-added { fill: #157347; font-weight: 600; } .lg.s-changed { fill: #9a5600; font-weight: 600; }
.lg.s-removed { fill: #c4321c; font-weight: 600; }
.foot { font-size: 11.5px; fill: #3b4655; }
.st .box { fill: #ffffff; stroke: #e1e5eb; stroke-width: 1.4; }
.st.hi .box { fill: #e8f0fc; stroke: #1f5fbf; }
.st-w { font-size: 13px; font-weight: 600; fill: #161c24; }
.fl { fill: none; stroke: #667385; stroke-width: 1.4; } .fl.loop { stroke-dasharray: 4 4; }
.fl.gate { stroke: #1f5fbf; stroke-dasharray: 2 4; opacity: .7; }
.fl-note { font-size: 11.5px; fill: #667385; }
.gate .box { fill: #e8f0fc; stroke: #1f5fbf; } .gate text { font-size: 12.5px; font-weight: 600; fill: #1f5fbf; }
.exit { font-size: 12.5px; font-weight: 600; fill: #161c24; }
.lane .box { fill: #ffffff; stroke: #e1e5eb; stroke-width: 1.2; }
.lane.person .box { fill: #e8f0fc; stroke: #1f5fbf; }
.life { stroke: #c9d0da; stroke-width: 1.2; stroke-dasharray: 3 4; }
.msg { fill: none; stroke: #667385; stroke-width: 1.4; }
.msg.frame { stroke: #1f5fbf; stroke-dasharray: 5 4; } .msg.person { stroke: #1f5fbf; stroke-width: 2; }
.msg-t { font-size: 11.5px; fill: #3b4655; } .msg-t.frame { fill: #1f5fbf; } .msg-t.person { fill: #1f5fbf; font-weight: 600; }
.num circle { fill: #667385; } .num.person circle { fill: #1f5fbf; }
.num text { fill: #ffffff; font-size: 10px; font-weight: 700; }
.note .box { fill: #fff3dd; stroke: #e9c98f; } .note text { font-size: 11.5px; fill: #9a5600; }
</style>
