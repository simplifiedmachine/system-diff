name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is left out for now: on this repository its runners were never assigned (cancelled after 15
        # minutes in the queue, no step run). Add macos-latest back once they are.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  map:
    # The README's system map is drawn from this repository's own code: it must be current.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: The system map is current (if not, run the two commands below and commit)
        run: |
          system-diff map --dir . --out docs/diagrams --check
          system-diff readme --json docs/diagrams/system.json --check
