name: Feature request
description: An idea to make system-diff more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you imagine it working. A sketch or screenshot is welcome.
  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      options: ["Yes", "With some guidance", "No, just suggesting"]
